<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#020617" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect x="16" y="16" width="224" height="224" rx="48" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="3" />

  <!-- Outer dial ring -->
  <circle cx="128" cy="128" r="82" fill="none" stroke="#1e293b" stroke-width="4" stroke-dasharray="6 8" />
  <circle cx="128" cy="128" r="82" fill="none" stroke="url(#glowGrad)" stroke-width="4" stroke-dasharray="160 360" filter="url(#glow)" />

  <!-- Power icon + Timer tick -->
  <path d="M128 68 V116" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" />
  <path d="M96 92 A52 52 0 1 0 160 92" fill="none" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" filter="url(#glow)" />
  
  <!-- Subtle center accent -->
  <circle cx="128" cy="128" r="4" fill="#60a5fa" />
</svg>
